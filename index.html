<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SIBIHA — Sistem Informasi Bayi dan HBIG</title>
  <style>
    :root {
      --primary: #0284C7;
      --primary-dark: #0369A1;
      --bg: #EEF6FC;
      --surface: #FFFFFF;
      --text: #0F172A;
      --muted: #64748B;
      --danger: #DC2626;
      --success: #059669;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    .wrapper-root {
      position: relative;
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    #appsScriptFrame {
      width: 100%;
      height: 100%;
      flex: 1;
      border: none;
      display: block;
      background: var(--bg);
    }

    .loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      background: linear-gradient(180deg, #0369A1 0%, #0284C7 55%, #075985 100%);
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      transition: opacity 0.28s ease, visibility 0.28s ease;
    }

    .loading-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-bg-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
      z-index: 1;
      user-select: none;
      -webkit-user-drag: none;
    }

    .splash-bg-img.broken {
      display: none;
    }

    .splash-fallback-brand {
      position: relative;
      z-index: 2;
      margin-top: max(44px, env(safe-area-inset-top, 24px));
      padding: 18px 22px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.28);
      backdrop-filter: blur(6px);
      text-align: center;
      max-width: min(88vw, 340px);
      display: none;
    }

    .loading-overlay.use-fallback .splash-fallback-brand {
      display: block;
    }

    .splash-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.6px;
      background: rgba(254, 243, 199, 0.24);
      color: #FEF3C7;
      padding: 3px 10px;
      border-radius: 999px;
      margin-bottom: 8px;
    }

    .splash-title {
      margin: 0;
      font-size: clamp(18px, 4.8vw, 22px);
      font-weight: 800;
      line-height: 1.25;
    }

    .splash-org {
      margin: 6px 0 0;
      font-size: 12px;
      opacity: 0.92;
      line-height: 1.4;
    }

    @media (orientation: landscape) and (min-width: 640px) {
      .splash-bg-img {
        object-fit: contain;
        background: radial-gradient(circle at center, #38BDF8 0%, #0284C7 65%, #0369A1 100%);
      }
    }

    .splash-bottom-bar {
      position: relative;
      z-index: 2;
      width: 100%;
      margin-top: auto;
      padding: 28px 20px calc(22px + env(safe-area-inset-bottom, 0px));
      background: linear-gradient(to top, rgba(3, 105, 161, 0.92) 0%, rgba(2, 132, 199, 0.62) 65%, rgba(2, 132, 199, 0) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(255, 255, 255, 0.32);
      border-top-color: #FFFFFF;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
      margin-bottom: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-sub {
      font-size: 12.5px;
      font-weight: 700;
      color: #FFFFFF;
      text-shadow: 0 1px 6px rgba(15, 23, 42, 0.45);
      margin: 0;
      max-width: min(88vw, 340px);
      line-height: 1.4;
    }

    .btn-retry {
      margin-top: 12px;
      border: 1px solid rgba(255, 255, 255, 0.75);
      background: rgba(15, 23, 42, 0.5);
      color: #FFFFFF;
      padding: 9px 18px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }

    .btn-retry:active {
      background: rgba(15, 23, 42, 0.75);
    }

    .wrapper-toast {
      position: fixed;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      z-index: 40;
      background: #0F172A;
      color: #FFFFFF;
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s ease;
      max-width: 90vw;
      text-align: center;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.25);
    }

    .wrapper-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <div class="wrapper-root">
    <div id="loadingOverlay" class="loading-overlay">
      <img
        id="splashBgImg"
        src="./splash_sibiha.png"
        alt="SIBIHA — Sistem Informasi Bayi dan HBIG"
        class="splash-bg-img"
      />

      <div class="splash-fallback-brand">
        <div class="splash-badge">HBIG MONITORING</div>
        <h1 class="splash-title">SIBIHA</h1>
        <p class="splash-org">Sistem Informasi Bayi &amp; HBIG<br />UPTD Puskesmas Kaliabang Tengah</p>
      </div>

      <div class="splash-bottom-bar">
        <div id="splashSpinner" class="spinner" aria-hidden="true"></div>
        <p id="loadingSub" class="loading-sub">Memuat aplikasi SIBIHA...</p>
        <button type="button" id="retryBtn" class="btn-retry" style="display:none;" onclick="reloadIframe(true)">
          Muat Ulang Aplikasi
        </button>
      </div>
    </div>

    <iframe
      id="appsScriptFrame"
      title="HBIG Monitoring Apps Script"
      allow="camera; microphone; geolocation; clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
  </div>

  <div id="wrapperToast" class="wrapper-toast"></div>

  <script>
    const SPLASH_CONFIG = {
      imageUrl: './splash_sibiha.png',
      loadingText: 'Memuat aplikasi SIBIHA...',
      minDisplayMs: 500
    };

    const APPS_SCRIPT_EXEC_URL = 'https://script.google.com/macros/s/AKfycbxapZK7slIwODyPyONIMF-WiXLwAfLU2dF6IgKA6eF_UngeMAibvb2ekn3-NexOPQ2uQA/exec';

    const iframeEl = document.getElementById('appsScriptFrame');
    const overlayEl = document.getElementById('loadingOverlay');
    const splashImgEl = document.getElementById('splashBgImg');
    const loadingSubEl = document.getElementById('loadingSub');
    const retryBtnEl = document.getElementById('retryBtn');
    const spinnerEl = document.getElementById('splashSpinner');
    const toastEl = document.getElementById('wrapperToast');

    let loadTimeoutId = null;
    let hideDelayTimerId = null;
    let splashShownAt = 0;
    let toastTimeoutId = null;
    const pendingChunkDownloads = {};

    if (splashImgEl) {
      splashImgEl.addEventListener('load', () => {
        splashImgEl.classList.remove('broken');
        if (overlayEl) overlayEl.classList.remove('use-fallback');
      });
      splashImgEl.addEventListener('error', () => {
        splashImgEl.classList.add('broken');
        if (overlayEl) overlayEl.classList.add('use-fallback');
      });
    }

    function applySplashConfig() {
      if (splashImgEl && SPLASH_CONFIG.imageUrl) {
        splashImgEl.classList.remove('broken');
        if (overlayEl) overlayEl.classList.remove('use-fallback');
        splashImgEl.src = SPLASH_CONFIG.imageUrl;
      } else if (overlayEl) {
        overlayEl.classList.add('use-fallback');
      }
      if (loadingSubEl && SPLASH_CONFIG.loadingText) {
        loadingSubEl.textContent = SPLASH_CONFIG.loadingText;
      }
    }

    function showWrapperToast(msg) {
      if (!toastEl) return;
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      if (toastTimeoutId) clearTimeout(toastTimeoutId);
      toastTimeoutId = setTimeout(() => {
        toastEl.classList.remove('show');
      }, 2800);
    }

    function hideLoadingOverlay() {
      if (loadTimeoutId) {
        clearTimeout(loadTimeoutId);
        loadTimeoutId = null;
      }
      if (hideDelayTimerId) {
        clearTimeout(hideDelayTimerId);
        hideDelayTimerId = null;
      }

      const elapsed = Date.now() - splashShownAt;
      const remaining = Math.max(0, (Number(SPLASH_CONFIG.minDisplayMs) || 0) - elapsed);

      hideDelayTimerId = setTimeout(() => {
        if (overlayEl) {
          overlayEl.classList.add('hidden');
        }
      }, remaining);
    }

    function showLoadingError(message) {
      if (loadTimeoutId) {
        clearTimeout(loadTimeoutId);
        loadTimeoutId = null;
      }
      if (!overlayEl) return;
      overlayEl.classList.remove('hidden');
      if (spinnerEl) spinnerEl.style.display = 'none';
      if (loadingSubEl) {
        loadingSubEl.textContent = message || 'Koneksi terganggu. Periksa jaringan internet Anda.';
      }
      if (retryBtnEl) {
        retryBtnEl.style.display = 'inline-block';
      }
    }

    function buildTargetUrl() {
      const url = new URL(APPS_SCRIPT_EXEC_URL);
      url.searchParams.set('_wv', 'android');
      url.searchParams.set('_ts', String(Date.now()));
      return url.toString();
    }

    function reloadIframe(forceFresh) {
      if (!iframeEl) return;
      splashShownAt = Date.now();
      if (retryBtnEl) retryBtnEl.style.display = 'none';
      if (spinnerEl) spinnerEl.style.display = 'block';
      if (loadingSubEl) {
        loadingSubEl.textContent = SPLASH_CONFIG.loadingText || 'Memuat aplikasi...';
      }
      if (overlayEl) overlayEl.classList.remove('hidden');

      if (loadTimeoutId) clearTimeout(loadTimeoutId);
      loadTimeoutId = setTimeout(() => {
        showLoadingError('Waktu muat habis. Coba muat ulang atau periksa koneksi internet.');
      }, 22000);

      iframeEl.src = forceFresh ? buildTargetUrl() : APPS_SCRIPT_EXEC_URL;
    }

    iframeEl.addEventListener('load', () => {
      hideLoadingOverlay();
    });

    iframeEl.addEventListener('error', () => {
      showLoadingError('Gagal memuat halaman Apps Script. Coba muat ulang.');
    });

    function getAndroidBridge() {
      const candidates = [
        window.HBIGAndroid,
        window.AndroidBridge,
        window.parent && window.parent.HBIGAndroid,
        window.parent && window.parent.AndroidBridge,
        window.top && window.top.HBIGAndroid,
        window.top && window.top.AndroidBridge
      ];
      for (let i = 0; i < candidates.length; i++) {
        const c = candidates[i];
        if (c && (typeof c.saveBase64File === 'function' || typeof c.downloadBase64File === 'function')) {
          return c;
        }
      }
      return null;
    }

    function triggerBrowserBlobDownload(cleanB64, fileName, mimeType) {
      const normalizedB64 = String(cleanB64 || '').replace(/[^A-Za-z0-9+/=]/g, '');
      if (!normalizedB64) {
        throw new Error('Base64 kosong');
      }
      const byteCharacters = atob(normalizedB64);
      const byteNumbers = new Array(byteCharacters.length);
      for (let i = 0; i < byteCharacters.length; i++) {
        byteNumbers[i] = byteCharacters.charCodeAt(i);
      }
      const byteArray = new Uint8Array(byteNumbers);
      const blob = new Blob([byteArray], { type: mimeType });
      const blobUrl = URL.createObjectURL(blob);

      const link = document.createElement('a');
      link.href = blobUrl;
      link.download = fileName;
      link.rel = 'noopener';
      document.body.appendChild(link);
      link.click();

      setTimeout(() => {
        if (link.parentNode) link.parentNode.removeChild(link);
        URL.revokeObjectURL(blobUrl);
      }, 2500);
    }

    function forwardFileDownloadToAndroid(payload) {
      if (!payload || typeof payload !== 'object') return false;
      const rawBase64 = payload.base64Data || payload.base64 || payload.data || '';
      if (!rawBase64) {
        showWrapperToast('Data file kosong, gagal mengunduh.');
        return false;
      }

      const fileName = String(payload.fileName || payload.filename || 'Data_Penerima_HBIG_dan_Pemantauan.xlsx');
      const mimeType = String(
        payload.mimeType ||
        payload.mime ||
        'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
      );
      const normalized = String(rawBase64).replace(/\s+/g, '');
      const cleanB64 = normalized.indexOf(',') >= 0 ? normalized.split(',')[1] : normalized;

      const bridge = getAndroidBridge();
      if (bridge) {
        try {
          if (typeof bridge.saveBase64File === 'function') {
            bridge.saveBase64File(cleanB64, fileName, mimeType);
          } else if (typeof bridge.downloadBase64File === 'function') {
            bridge.downloadBase64File(cleanB64, fileName, mimeType);
          }
          showWrapperToast('Menyimpan file ke perangkat: ' + fileName);
          return true;
        } catch (_err) {
          showWrapperToast('Bridge Android gagal, mencoba unduh standar...');
        }
      }

      try {
        triggerBrowserBlobDownload(cleanB64, fileName, mimeType);
        showWrapperToast('Mengunduh file: ' + fileName);
        return true;
      } catch (_err) {
        showWrapperToast('Gagal mengunduh file di perangkat ini.');
        return false;
      }
    }

    function cleanupStaleChunks_() {
      const now = Date.now();
      Object.keys(pendingChunkDownloads).forEach(key => {
        const entry = pendingChunkDownloads[key];
        if (!entry || now - entry.createdAt > 60000) {
          delete pendingChunkDownloads[key];
        }
      });
    }

    window.addEventListener('message', (event) => {
      cleanupStaleChunks_();
      let data = event.data;
      if (typeof data === 'string') {
        try {
          data = JSON.parse(data);
        } catch (_e) {
          return;
        }
      }
      if (!data || typeof data !== 'object') return;

      if (data.type === 'HBIG_APP_READY') {
        hideLoadingOverlay();
      } else if (data.type === 'HBIG_DOWNLOAD_BASE64') {
        forwardFileDownloadToAndroid(data);
      } else if (data.type === 'HBIG_DOWNLOAD_CHUNK') {
        const id = data.uploadId;
        if (!id) return;
        const total = Math.max(1, Number(data.total) || 1);
        if (!pendingChunkDownloads[id]) {
          pendingChunkDownloads[id] = {
            createdAt: Date.now(),
            total: total,
            parts: new Array(total).fill(''),
            fileName: data.fileName,
            mimeType: data.mimeType
          };
        }
        const bucket = pendingChunkDownloads[id];
        bucket.createdAt = Date.now();
        const idx = Number(data.index);
        if (idx >= 0 && idx < bucket.parts.length) {
          bucket.parts[idx] = String(data.chunk || '');
        }
        if (bucket.parts.every(p => p.length > 0)) {
          const fullBase64 = bucket.parts.join('');
          delete pendingChunkDownloads[id];
          forwardFileDownloadToAndroid({
            base64Data: fullBase64,
            fileName: bucket.fileName,
            mimeType: bucket.mimeType
          });
        }
      } else if (data.type === 'HBIG_TOAST' && data.message) {
        showWrapperToast(String(data.message));
      }
    });

    window.addEventListener('online', () => {
      if (overlayEl && !overlayEl.classList.contains('hidden')) {
        reloadIframe(true);
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      applySplashConfig();
      reloadIframe(true);
    });
  </script>
</body>
</html>
